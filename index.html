<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ขอบเขตตำบลโค้งไผ่ + เรดาร์ดอยมูเซอ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    /* =========================================
       ปรับแต่งหน้าตาป๊อปอัพของ Leaflet
       ========================================= */
    .leaflet-popup-content-wrapper {
      border-radius: 12px; padding: 0; overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .leaflet-popup-content {
      margin: 0; width: 300px !important; max-width: 85vw;
    }
    .leaflet-popup-tip { box-shadow: 0 10px 25px rgba(0,0,0,0.2); }

    .popup-header {
      background: #2c3e50; color: white;
      padding: 15px 10px; text-align: center;
    }
    .popup-header h3 { margin: 0 0 4px 0; font-size: 18px; font-weight: 600; }
    .popup-header p { margin: 0; font-size: 13px; opacity: 0.85; }
    .popup-body { padding: 15px; }

    .map-container {
      border-radius: 8px; overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 15px; border: 1px solid #eee;
    }
    .map-container iframe { display: block; width: 100%; height: 160px; border: 0; }

    .weather-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 10px;
      background: linear-gradient(135deg, #007bff, #0056b3);
      color: white; border: none; border-radius: 6px;
      font-size: 14px; font-weight: bold; cursor: pointer;
      transition: all 0.2s ease;
    }
    .weather-btn:hover {
      background: linear-gradient(135deg, #0056b3, #004085);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0,123,255,0.3);
    }

    /* =========================================
       Modal สภาพอากาศ
       ========================================= */
    #weatherModal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.85); z-index: 10000;
      justify-content: center; align-items: center; padding: 15px; box-sizing: border-box;
    }
    #weatherModal .modal-content {
      width: 100%; max-width: 900px; background-color: #1a1a1a;
      border-radius: 12px; position: relative; padding: 10px; box-sizing: border-box;
    }
    #weatherModal .close-btn {
      position: absolute; top: -15px; right: -15px;
      background-color: #ff3b30; color: white;
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      font-size: 22px; font-weight: bold; cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
    }
    #weatherModal .close-btn:hover { background-color: #d32f2f; }
    #weatherModal img {
      width: 100%; height: auto; max-height: 80vh;
      object-fit: contain; display: block; border-radius: 6px;
    }
  </style>
</head>
<body>
<div id="map"></div>

<!-- Modal สำหรับแสดงสภาพอากาศ -->
<div id="weatherModal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeWeatherModal()">&times;</span>
    <img id="weatherImage" src="" alt="Weather Forecast">
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const MAP_CENTER = [16.10, 99.65]; 
  const MAP_ZOOM = 12;

  var map = L.map('map').setView(MAP_CENTER, MAP_ZOOM);

  // ---- Base Layers ----
  var googleLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
    maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'], attribution: '&copy; Google'
  });

  var openTopoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    maxZoom: 17, subdomains: 'abc', attribution: '&copy; OpenTopoMap'
  });

  googleLayer.addTo(map);

  // ---- ข้อมูลขอบเขต ----
  const khongPhaiGeoJSON = {
    "type": "Feature",
    "properties": {
      "name": "ตำบลโค้งไผ่",
      "province": "จังหวัดกำแพงเพชร",
      "district": "อำเภอขาณุวรลักษบุรี"
    },
    "geometry": {
      "type": "Polygon",
      "coordinates": [[
        [99.7611, 16.0689], [99.7563, 16.0682], [99.7535, 16.0704], [99.7462, 16.0713], 
        [99.7438, 16.0767], [99.7361, 16.0851], [99.7265, 16.0857], [99.7137, 16.0676], 
        [99.7026, 16.0628], [99.6993, 16.0644], [99.6956, 16.0705], [99.657, 16.0898], 
        [99.6425, 16.0979], [99.6405, 16.1007], [99.6318, 16.1025], [99.6243, 16.102], 
        [99.6139, 16.1049], [99.6076, 16.1026], [99.6005, 16.1036], [99.5926, 16.1008], 
        [99.5835, 16.1049], [99.5767, 16.1059], [99.566, 16.0987], [99.5633, 16.0954], 
        [99.5639, 16.0914], [99.5616, 16.0876], [99.5485, 16.0835], [99.5568, 16.0965], 
        [99.5723, 16.1153], [99.5794, 16.1131], [99.5823, 16.1155], [99.5884, 16.1142], 
        [99.6024, 16.118], [99.6217, 16.1182], [99.6259, 16.1217], [99.6348, 16.1254], 
        [99.6382, 16.1317], [99.6457, 16.1373], [99.6478, 16.1413], [99.6548, 16.1426], 
        [99.6581, 16.1395], [99.6695, 16.1379], [99.6766, 16.1337], [99.6857, 16.1337], 
        [99.6904, 16.1314], [99.6972, 16.1308], [99.7036, 16.1242], [99.7122, 16.126], 
        [99.7196, 16.1321], [99.7263, 16.1299], [99.7338, 16.1305], [99.7332, 16.1246], 
        [99.7373, 16.1139], [99.7465, 16.0993], [99.7611, 16.0689]
      ]]
    }
  };

  const boundaryLayer = L.geoJSON(khongPhaiGeoJSON, {
    style: { color: '#ff3b30', weight: 3, opacity: 1, fillColor: '#ff3b30', fillOpacity: 0.2 },
    onEachFeature: (feature, layer) => {
      const p = feature.properties;
      const popupContent = `
        <div>
          <div class="popup-header">
            <h3>${p.name}</h3>
            <p>${p.district} • ${p.province}</p>
          </div>
          <div class="popup-body">
            <div class="map-container">
              <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d38419.75224506495!2d99.67094781491761!3d16.09511857502715!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x30e091641d29ed9f%3A0x4e7349541bea0544!2z4Lit4Lia4LiVL-C5guC4hOC5ieC4h-C5hOC4nCk!5e1!3m2!1sth!2sch!4v1794802331324!5m2!1sth!2sch" 
                allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin">
              </iframe>
            </div>
            <button onclick="openWeatherModal()" class="weather-btn">
              <span>🌤️</span> เช็คสภาพอากาศ
            </button>
          </div>
        </div>
      `;
      layer.bindPopup(popupContent);
      layer.on('popupopen', function(e) {
        var popupNode = e.popup.getElement();
        var iframe = popupNode.querySelector('iframe');
        if (iframe) { L.DomEvent.disableClickPropagation(iframe); }
      });
    }
  }).addTo(map);

  map.fitBounds(boundaryLayer.getBounds(), { padding: [20, 20] });

  // ---- 3. เพิ่มเลเยอร์เรดาร์ดอยมูเซอ (ตาก) ----
  const radarBounds = [[14.581365, 96.288313], [18.918955, 101.575932]];
  
  const radarOverlay = L.imageOverlay('https://weather.tmd.go.th/tak/takloop.gif', radarBounds, {
    opacity: 1, 
    interactive: false
  });

  // 🌟 เมื่อเปิดเรดาร์ -> ซูมออกให้เห็นเรดาร์เต็มพื้นที่
  radarOverlay.on('add', function() {
    map.fitBounds(radarBounds);
  });

  // 🌟 เมื่อปิดเรดาร์ -> ซูมกลับมาที่กรอบขอบเขตตำบลโค้งไผ่เสมอ
  radarOverlay.on('remove', function() {
    map.fitBounds(boundaryLayer.getBounds(), { padding: [20, 20] });
  });

  // ---- ฟังก์ชัน Modal ----
  function openWeatherModal() {
    const modal = document.getElementById('weatherModal');
    const img = document.getElementById('weatherImage');
    img.src = 'https://www.yr.no/en/content/2-8387260/meteogram.svg?mode=dark';
    modal.style.display = 'flex';
  }

  function closeWeatherModal() {
    const modal = document.getElementById('weatherModal');
    const img = document.getElementById('weatherImage');
    modal.style.display = 'none';
    img.src = '';
  }

  document.getElementById('weatherModal').addEventListener('click', function(event) {
    if (event.target === this) closeWeatherModal();
  });

  // ---- 4. เมนูเลือกแผนที่ (Base Layers & Overlays) ----
  const baseLayers = { 
    "ภาพถ่ายดาวเทียม": googleLayer, 
    "ภูมิประเทศ": openTopoLayer 
  };

  const overlays = { 
    "ขอบเขตตำบลโค้งไผ่": boundaryLayer,
    "เรดาร์ดอยมูเซอ (ตาก)": radarOverlay 
  };

  L.control.layers(baseLayers, overlays, { position: 'topright', collapsed: false }).addTo(map);
  
  L.control.scale({ imperial: false }).addTo(map);
</script>
</body>
</html>
